  <body>
    <div id="root"></div>
    <script>
      (() => {
        const playlistUrl = "https://www.youtube.com/playlist?list=PLZUbOxFYVnnXaqbaORt3bh_I8H-POGM9B";
        const labels = {
          en: "Original recordings: Watch the 117-lecture YouTube playlist ↗",
          te: "మూల రికార్డింగులు: YouTubeలో 117 ఉపన్యాసాల ప్లేలిస్ట్ చూడండి ↗",

          fr: "Enregistrements originaux : voir la playlist YouTube de 117 leçons ↗",
          de: "Originalaufnahmen: YouTube-Playlist mit 117 Vorlesungen ansehen ↗",
          nl: "Originele opnamen: bekijk de YouTube-playlist met 117 lezingen ↗",
        };

        const installSourceLink = () => {
          const intro = document.querySelector(".library-intro");
          if (!intro) return;
          const lang = document.documentElement.lang || "en";
          let row = intro.querySelector(".library-original-source");
          if (!row) {
            row = document.createElement("p");
            row.className = "library-original-source";
            const anchor = document.createElement("a");
            anchor.href = playlistUrl;
            anchor.target = "_blank";
            anchor.rel = "noopener noreferrer";
            anchor.setAttribute("aria-label", "Open the original Master EK Homoeo Lectures playlist on YouTube");
            row.appendChild(anchor);
            intro.appendChild(row);
          }
          const anchor = row.querySelector("a");
          if (anchor) anchor.textContent = labels[lang] || labels.en;
        };

        const root = document.getElementById("root");
        if (root) {
          const observer = new MutationObserver(installSourceLink);
          observer.observe(root, { childList: true, subtree: true });
          new MutationObserver(installSourceLink).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
        }
        installSourceLink();
      })();
    </script>
