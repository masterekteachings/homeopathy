name: Validate Homeopathy publication snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication repository
        uses: actions/checkout@v6

      - name: Validate self-contained learner release
        shell: bash
        run: |
          test -f release/index.html
          test -f release/status.json
          test -f release/.publication-manifest.json
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          release = Path('release')
          status = json.loads((release / 'status.json').read_text(encoding='utf-8'))
          manifest = json.loads((release / '.publication-manifest.json').read_text(encoding='utf-8'))

          philosophy = status.get('philosophy_baseline') or {}
          assert philosophy.get('publishable') == 38, status
          assert philosophy.get('total') == 38, status
          assert philosophy.get('positions') == list(range(1, 39)), status
          assert status['publication_surface'] == 'learner-only', status
          assert status['release_stage'] in {'final-qc-gated', 'incremental-core-final-qc-gated'}, status

          assert manifest['publication_surface'] == 'learner-only', manifest
          assert manifest['publication_mode'] in {'final-qc-gated', 'incremental-core-final-qc-gated'}, manifest
          quality = manifest.get('quality_gate') or {}
          philosophy_positions = quality.get('philosophy_positions') or []
          philosophy_ok = quality.get('philosophy_38_38') is True and philosophy_positions == list(range(1, 39))
          legacy_ok = quality.get('qc_passed_trilingual_philosophy') == 38
          assert philosophy_ok or legacy_ok, manifest

          approved = manifest.get('approved_files', [])
          expected = {item['path']: item['sha256'] for item in approved}
          actual_paths = {
              p.relative_to(release).as_posix()
              for p in release.rglob('*')
              if p.is_file() and p.name != '.publication-manifest.json'
          }
          if set(expected) != actual_paths:
              missing = sorted(set(expected) - actual_paths)
              extra = sorted(actual_paths - set(expected))
              raise SystemExit(f'manifest/file mismatch missing={missing} extra={extra}')

          for rel, expected_sha in expected.items():
              actual_sha = hashlib.sha256((release / rel).read_bytes()).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(f'hash mismatch for {rel}')

          forbidden = (
              'ProjectDashboard',
              'owner_dashboard_route',
              '#/project',
              'raw.githubusercontent.com/vamsikrishnajallipalli/master-ek-homeo-notes',
              'VAMSI_AI_MODUS_OPERANDI',
              'PROJECT_STATE.md',
              'D72_RUNTIME',
          )
          for path in release.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js', '.css', '.json', '.map'}:
                  continue
              if path.name == '.publication-manifest.json':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for marker in forbidden:
                  if marker in text:
                      raise SystemExit(f'internal marker {marker!r} found in {path}')

          if not status.get('source_commit') or not manifest.get('source_commit'):
              print('warning: legacy snapshot has empty source_commit; next publisher release must repair traceability')

          print('validated self-contained learner-only publication snapshot')
          PY
