name: Publish Homeopathy learning reader

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication repository
        uses: actions/checkout@v6

      - name: Checkout current production source
        uses: actions/checkout@v6
        with:
          repository: vamsikrishnajallipalli/master-ek-homeo-notes
          ref: main
          path: source
          persist-credentials: false

      - name: Record source commit
        id: source
        shell: bash
        run: echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/reader/package-lock.json

      - name: Build noncanonical 38-lecture preview
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          cp -R source source-preview
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('source-preview/notes')
          language_dirs = (root, root / 'te', root / 'ru')
          missing = []
          for position in range(1, 39):
              for directory in language_dirs:
                  matches = list(directory.glob(f'{position:03d}-*.md'))
                  if len(matches) != 1:
                      missing.append(f'{position:03d}:{directory}:{len(matches)}')
                      continue
                  path = matches[0]
                  text = path.read_text(encoding='utf-8')
                  updated, count = re.subn(
                      r'(?m)^note_status:\s*[^\n]+$',
                      'note_status: complete',
                      text,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit(f'preview build: note_status missing in {path}')
                  path.write_text(updated, encoding='utf-8')
          if missing:
              raise SystemExit('preview build: incomplete trilingual draft set: ' + ', '.join(missing))
          PY
          python3 scripts/build_public_reader.py source-preview preview
          python3 - <<'PY'
          from pathlib import Path
          import json

          out = Path('preview')
          old = '/homeopathy/'
          new = '/homeopathy/preview/'
          for path in out.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js', '.css', '.json', '.map'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')

          status_path = out / 'status.json'
          status = json.loads(status_path.read_text(encoding='utf-8'))
          for key in list(status):
              if key.startswith('qc_passed_'):
                  status.pop(key)
          status.update({
              'release_stage': 'preview',
              'preview_trilingual_philosophy': 38,
              'preview_notice': 'All 38 trilingual Philosophy draft bundles are readable here while final editorial/source QC continues.',
              'publication_gate': 'PREVIEW ONLY: draft visibility is noncanonical; canonical /homeopathy/ contains only final-QC complete trilingual bundles',
              'canonical_reader': '/homeopathy/',
          })
          status_path.write_text(json.dumps(status, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Build final-QC-gated learner-facing Reader
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: python3 scripts/build_public_reader.py source public

      - name: Add noncanonical preview to Pages artifact
        shell: bash
        run: |
          mkdir -p public/preview
          cp -R preview/. public/preview/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
