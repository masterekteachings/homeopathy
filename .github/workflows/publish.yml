name: Publish Homeopathy learning reader

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication repository
        uses: actions/checkout@v6

      - name: Require self-contained approved release snapshot
        shell: bash
        run: |
          test -f release/.publication-manifest.json
          test -f release/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('release/.publication-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('publication_surface') != 'learner-only':
              raise SystemExit('release is not marked learner-only')
          if manifest.get('publication_mode') != 'final-qc-gated':
              raise SystemExit('release is not final-QC-gated')
          quality = manifest.get('quality_gate') or {}
          if quality.get('qc_passed_trilingual_philosophy') != 38:
              raise SystemExit('release does not contain the verified 38/38 Philosophy set')
          PY

      - name: Stage committed release snapshot
        shell: bash
        run: |
          rm -rf public
          cp -R release public

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
