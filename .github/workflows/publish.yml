name: Publish Homeopathy learning reader

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication repository
        uses: actions/checkout@v6

      - name: Detect self-contained release snapshot
        id: snapshot
        shell: bash
        run: |
          if [[ -f release/.publication-manifest.json && -f release/index.html ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Using committed public release snapshot; private source checkout is not required."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No committed release snapshot yet; retaining legacy source-build path during cutover."
          fi

      - name: Stage committed release snapshot
        if: steps.snapshot.outputs.available == 'true'
        shell: bash
        run: |
          rm -rf public
          cp -R release public
          test -f public/index.html
          test -f public/.publication-manifest.json

      - name: Checkout current production source (legacy cutover fallback)
        if: steps.snapshot.outputs.available != 'true'
        uses: actions/checkout@v6
        with:
          repository: vamsikrishnajallipalli/master-ek-homeo-notes
          ref: main
          path: source
          persist-credentials: false

      - name: Record source commit
        if: steps.snapshot.outputs.available != 'true'
        id: source
        shell: bash
        run: echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.snapshot.outputs.available != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/reader/package-lock.json

      - name: Build noncanonical 38-lecture preview
        if: steps.snapshot.outputs.available != 'true'
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
          MASTER_EK_PUBLICATION_MODE: preview
        shell: bash
        run: |
          cp -R source source-preview
          python3 scripts/build_public_reader.py source-preview preview
          python3 - <<'PY'
          from pathlib import Path
          import json

          out = Path('preview')
          old = '/homeopathy/'
          new = '/homeopathy/preview/'
          for path in out.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js', '.css', '.json', '.map'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')

          status_path = out / 'status.json'
          status = json.loads(status_path.read_text(encoding='utf-8'))
          status.update({
              'preview_notice': 'Trilingual Philosophy draft bundles are readable here while final editorial/source QC continues. Draft visibility is not final publication readiness.',
              'canonical_reader': '/homeopathy/',
          })
          status_path.write_text(json.dumps(status, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Build final-QC-gated learner-facing Reader
        if: steps.snapshot.outputs.available != 'true'
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
          MASTER_EK_PUBLICATION_MODE: final
        run: python3 scripts/build_public_reader.py source public

      - name: Add noncanonical preview to Pages artifact
        if: steps.snapshot.outputs.available != 'true'
        shell: bash
        run: |
          mkdir -p public/preview
          cp -R preview/. public/preview/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
