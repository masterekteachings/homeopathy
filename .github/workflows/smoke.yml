name: Smoke test canonical Homeopathy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication repository
        uses: actions/checkout@v6

      - name: Verify committed release and wait for canonical Pages
        shell: bash
        run: |
          test -f release/.publication-manifest.json
          test -f release/status.json
          test -f release/index.html
          export EXPECTED_SOURCE="$(python3 -c 'import json; print(json.load(open("release/status.json"))["source_commit"])')"
          export BASE="https://masterekteachings.github.io/homeopathy"

          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request

          base = os.environ['BASE']
          expected_source = os.environ['EXPECTED_SOURCE']

          def get(url: str) -> str:
              req = urllib.request.Request(url, headers={'User-Agent': 'master-ek-publication-smoke/2.0'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.read().decode('utf-8', errors='replace')

          last = ''
          for attempt in range(1, 25):
              cache = int(time.time())
              try:
                  status = json.loads(get(f'{base}/status.json?smoke={cache}'))
              except Exception as exc:
                  print(f'attempt {attempt}: status fetch failed: {exc}')
                  time.sleep(15)
                  continue
              live = status.get('source_commit', '')
              last = live
              if (
                  live == expected_source
                  and status.get('qc_passed_trilingual_philosophy') == 38
                  and status.get('trilingual_philosophy_total') == 38
                  and status.get('publication_surface') == 'learner-only'
                  and status.get('release_stage') == 'final-qc-gated'
              ):
                  break
              print(f'attempt {attempt}: waiting for deployed committed release; expected={expected_source[:12]} live={live[:12]}')
              time.sleep(15)
          else:
              raise SystemExit(f'canonical Pages did not deploy committed learner release; last source_commit={last}')

          html = get(base + '/?smoke=' + str(int(time.time())))
          assets = list(dict.fromkeys(re.findall(r'(?:src|href)="([^"]+\.js)"', html)))
          if not assets:
              raise SystemExit('no JavaScript asset found in canonical HTML')

          bundles = []
          for asset in assets:
              url = asset if asset.startswith('http') else urllib.parse.urljoin(base + '/', asset)
              bundles.append(get(url + ('&' if '?' in url else '?') + 'smoke=' + str(int(time.time()))))
          deployed_js = '\n'.join(bundles)

          required = [
              'Explore & search',
              'Search Philosophy',
              'Browse the corpus',
              'Teaching development',
              'బోధన వికాసం',
              'Развитие учения',
              'Vital force becomes the central dynamic explanation',
              'Psora becomes an organising chronic idea',
              "The Organon is established as Hahnemann's foundational source-book",
              'Totality is first defined as the characteristic combination',
              'Tuberculinum enters as a deep constitutional remedy',
              'The tubercular miasm is introduced as a later constitutional pattern',
              'The course begins by defining Homeopathy through sārūpya siddhānta',
              'Potentization is introduced as the preparation that reduces crude poisonous material',
              'Materia Medica is introduced by its source of knowledge',
              'Nyāsa Vidyā is introduced as the ancient science of correspondences',
              'Sycosis is established first by its physical direction',
              'The syphilitic tendency is first distinguished by direction',
              "Hering's three laws of cure are explicitly established as tests of direction after treatment",
              'అధ్యయన సహచరి',
              'Учебный помощник',
              'Public-domain historical scan of The Chronic Diseases',
          ]
          missing = [item for item in required if item not in deployed_js]
          if missing:
              raise SystemExit('deployed JS missing learner/progression strings: ' + ', '.join(missing))

          forbidden = [
              'ProjectDashboard',
              'owner_dashboard_route',
              '#/project',
              'raw.githubusercontent.com/vamsikrishnajallipalli/master-ek-homeo-notes',
              'VAMSI_AI_MODUS_OPERANDI',
          ]
          leaked = [item for item in forbidden if item in html or item in deployed_js]
          if leaked:
              raise SystemExit('public learner bundle contains internal markers: ' + ', '.join(leaked))

          print(f'canonical Pages matches committed learner-only 38/38 release {expected_source[:12]}')
          PY
