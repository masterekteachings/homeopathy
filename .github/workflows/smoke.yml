name: Smoke test canonical Homeopathy Pages

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production source
        uses: actions/checkout@v6
        with:
          repository: vamsikrishnajallipalli/master-ek-homeo-notes
          ref: main
          path: source
          fetch-depth: 200
          persist-credentials: false

      - name: Wait for canonical Pages to reach current source or newer
        shell: bash
        run: |
          EXPECTED="$(git -C source rev-parse HEAD)"
          BASE="https://masterekteachings.github.io/homeopathy"
          LAST=""

          for attempt in $(seq 1 24); do
            CACHE="$(date +%s)"
            if STATUS="$(curl -fsSL --retry 2 "$BASE/status.json?smoke=$CACHE")"; then
              LIVE="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("source_commit", ""))' <<<"$STATUS")"
              COUNT="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("qc_passed_trilingual_philosophy", 0))' <<<"$STATUS")"
              TOTAL="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("trilingual_philosophy_total", 0))' <<<"$STATUS")"
              LAST="$LIVE"

              if [[ -n "$LIVE" && "$COUNT" == "38" && "$TOTAL" == "38" ]]; then
                git -C source fetch --quiet --depth=200 origin "$LIVE" || true
                if git -C source merge-base --is-ancestor "$EXPECTED" "$LIVE" 2>/dev/null; then
                  export BASE
                  python3 - <<'PY'
          import os
          import re
          import time
          import urllib.parse
          import urllib.request

          base = os.environ['BASE']

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'master-ek-publication-smoke/1.0'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.read().decode('utf-8', errors='replace')

          html = get(base + '/?smoke=' + str(int(time.time())))
          assets = list(dict.fromkeys(re.findall(r'(?:src|href)="([^"]+\.js)"', html)))
          if not assets:
              raise SystemExit('no JavaScript asset found in canonical HTML')

          bundles = []
          for asset in assets:
              if asset.startswith('http'):
                  url = asset
              else:
                  url = urllib.parse.urljoin(base + '/', asset)
              bundles.append(get(url + ('&' if '?' in url else '?') + 'smoke=' + str(int(time.time()))))

          deployed_js = '\n'.join(bundles)
          required = [
              'Explore & search',
              'Search Philosophy',
              'Browse the corpus',
              'Teaching development',
              'బోధన వికాసం',
              'Развитие учения',
              'Vital force becomes the central dynamic explanation',
              'Psora becomes an organising chronic idea',
          ]
          missing = [item for item in required if item not in deployed_js]
          if missing:
              raise SystemExit(
                  'deployed JS missing learner/progression strings after scanning '
                  + str(len(assets)) + ' asset(s): ' + ', '.join(missing)
              )
          print(
              f'canonical Pages is current/newer and Explore/search + reviewed teaching progression '
              f'is present across {len(assets)} JS asset(s)'
          )
          PY
                  exit 0
                fi
              fi
            fi
            echo "attempt $attempt: waiting for source >= $EXPECTED; live=$LAST"
            sleep 15
          done

          echo "canonical Pages did not reach source >= $EXPECTED; last source_commit=$LAST" >&2
          exit 1
