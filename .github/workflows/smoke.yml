name: Smoke test canonical Homeopathy Pages

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production source
        uses: actions/checkout@v6
        with:
          repository: vamsikrishnajallipalli/master-ek-homeo-notes
          ref: main
          path: source
          persist-credentials: false

      - name: Wait for canonical Pages to reach current source
        shell: bash
        run: |
          EXPECTED="$(git -C source rev-parse HEAD)"
          BASE="https://masterekteachings.github.io/homeopathy"
          export EXPECTED BASE
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request

          expected = os.environ['EXPECTED']
          base = os.environ['BASE']
          last = None

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'master-ek-publication-smoke/1.0'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.read().decode('utf-8', errors='replace')

          for attempt in range(24):
              try:
                  status_text = get(base + '/status.json?smoke=' + str(int(time.time())))
                  status = json.loads(status_text)
                  last = status.get('source_commit')
                  if (
                      last == expected
                      and status.get('qc_passed_trilingual_philosophy') == 38
                      and status.get('trilingual_philosophy_total') == 38
                  ):
                      html = get(base + '/?smoke=' + str(int(time.time())))
                      assets = re.findall(r'(?:src|href)="([^"]+\.js)"', html)
                      if not assets:
                          raise RuntimeError('no JavaScript asset found in canonical HTML')
                      js_url = assets[-1]
                      if js_url.startswith('/'):
                          js_url = 'https://masterekteachings.github.io' + js_url
                      elif not js_url.startswith('http'):
                          js_url = base + '/' + js_url.lstrip('./')
                      js = get(js_url + ('&' if '?' in js_url else '?') + 'smoke=' + str(int(time.time())))
                      required = ['Explore & search', 'Search Philosophy', 'Browse the corpus']
                      missing = [item for item in required if item not in js]
                      if missing:
                          raise RuntimeError('deployed JS missing learner strings: ' + ', '.join(missing))
                      print('canonical Pages is current and Explore/search bundle is deployed')
                      raise SystemExit(0)
              except Exception as exc:
                  print(f'attempt {attempt + 1}: waiting: {exc}')
              time.sleep(15)

          raise SystemExit(f'canonical Pages did not reach source {expected}; last source_commit={last}')
          PY
